<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMA · Sensory migraine prototype</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="desktop" aria-hidden="true"></div>
  <div id="stage"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LUMA</span>
      <span class="brand-sub">Sensory migraine prototype</span>
    </div>
    <nav id="stepper" aria-label="Story"></nav>
    <div class="sim-chip" title="Every number in this prototype is generated by js/sim-data.js">
      <span class="sim-dot"></span>Simulated data
    </div>
  </header>

  <section id="intake" class="glass panel-intake" hidden></section>
  <aside id="hud" class="glass hud" hidden></aside>
  <aside id="events" class="events" hidden></aside>
  <section id="portfolio" class="window" hidden></section>
  <aside id="pathways" class="glass pathways" hidden></aside>
  <section id="results" class="results" hidden></section>
  <div id="explain" class="explain glass" role="dialog" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="caption-bar">
    <div id="caption" class="caption" aria-live="polite"></div>
    <div class="transport">
      <button id="btn-prev" class="icon-btn" title="Previous (←)" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button id="btn-play" class="icon-btn" title="Autoplay (space)" aria-label="Toggle autoplay">
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
      <button id="btn-next" class="icon-btn" title="Next (→)" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </footer>

  <div id="loading" class="loading">
    <div class="loading-mark"></div>
    <div class="loading-title">LUMA</div>
    <div class="loading-bar"><span id="loading-fill"></span></div>
    <div id="loading-text" class="loading-text">Loading brain model</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
